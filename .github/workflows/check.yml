name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: little-spectrum

jobs:
  check:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: little-spectrum/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: little-spectrum/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
